<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo to Gekko</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --muted:#566073; --card:#fff; --line:#d9dde4; --accent:#2457d6; --on-accent:#fff; --warn:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --fg:#e8eaf0; --muted:#98a2b3; --card:#1d222b; --line:#323a47; --accent:#6c93ff; --on-accent:#0b1020; --warn:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:28px 16px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  textarea { width:100%; min-height:360px; font:13px/1.45 ui-monospace, Menlo, monospace; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; }
  .field { display:block; margin-top:14px; font-weight:600; }
  .field input { display:block; width:100%; max-width:260px; margin-top:4px; font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .hint { display:block; font-weight:400; font-size:.85rem; color:var(--muted); margin-top:2px; }
  .field input + .hint { margin-top:4px; }
  #status { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
  #messages { margin:0 0 12px; padding-left:18px; font-size:.9rem; color:var(--muted); }
  #messages .warn { color:var(--warn); font-weight:600; }
  #error { color:var(--warn); white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Tempo to Gekko</h1>
  <p class="sub">Convert a Jira Tempo worklog export (.xls) into text lines ready to paste into Gekko.
     The file is processed in your browser and never uploaded.</p>

  <div class="card">
    <div id="drop" tabindex="0">Drop the Tempo .xls file here, or click to choose it</div>
    <input id="file" type="file" accept=".xls" class="hidden">
    <label class="field">General meetings Jira issue
      <span class="hint">The common Jira issue you log all your meetings on (daily, planning, workshops&hellip;).</span>
      <input id="meetingIssue" type="text" value="EHEALTH-9360" spellcheck="false" autocomplete="off">
      <span class="hint">Worklogs on this issue use their Work Description as the line text. Separate several keys with commas.</span>
    </label>
    <p id="status">Loading converter&hellip;</p>
    <p id="error" class="hidden"></p>
  </div>

  <div class="card hidden" id="result">
    <ul id="messages"></ul>
    <div class="row">
      <button class="primary" id="copy">Copy</button>
      <button id="download">Download .txt</button>
    </div>
    <textarea id="out" readonly spellcheck="false"></textarea>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
let pyodide, convert, outName = "gekko.txt", lastData = null;

function setStatus(text) { $("status").textContent = text; }
function showError(text) { $("error").textContent = text; $("error").classList.toggle("hidden", !text); }

async function init() {
  try {
    pyodide = await loadPyodide();
    setStatus("Installing xlrd…");
    await pyodide.loadPackage("micropip");
    await pyodide.pyimport("micropip").install("xlrd==2.0.1");
    const src = await (await fetch("tempo_to_gekko.py?t=" + Date.now(), { cache: "no-store" })).text();
    pyodide.FS.writeFile("tempo_to_gekko.py", src);
    convert = pyodide.pyimport("tempo_to_gekko").convert_bytes;
    setStatus("Ready.");
  } catch (e) {
    setStatus("");
    showError("Could not load the converter: " + e);
  }
}

function meetingKeys() {
  return $("meetingIssue").value.split(",").map(k => k.trim().toUpperCase()).filter(Boolean);
}

async function handleFile(file) {
  if (!file) return;
  lastData = new Uint8Array(await file.arrayBuffer());
  outName = file.name.replace(/\.[^.]+$/, "") + "_gekko.txt";
  await run(file.name);
}

async function run(name) {
  showError("");
  if (!convert) { showError("The converter is still loading, try again in a moment."); return; }
  setStatus("Converting " + name + "…");
  try {
    const res = convert(lastData.slice(), meetingKeys()).toJs();
    const [text, messages] = res;
    $("out").value = text;
    $("messages").replaceChildren(...messages.map(m => {
      const li = document.createElement("li");
      li.textContent = m;
      if (m.startsWith("WARNING")) li.className = "warn";
      return li;
    }));
    $("result").classList.remove("hidden");
    setStatus("Converted " + name + ".");
  } catch (e) {
    $("result").classList.add("hidden");
    setStatus("");
    showError("Conversion failed. Is this a Tempo Worklogs .xls export?\n\n" + e);
  }
}

try { $("meetingIssue").value = localStorage.getItem("meetingIssue") || $("meetingIssue").value; } catch {}
$("meetingIssue").addEventListener("change", () => {
  try { localStorage.setItem("meetingIssue", $("meetingIssue").value); } catch {}
  if (lastData) run("the file");
});

$("drop").addEventListener("click", () => $("file").click());
$("drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
$("file").addEventListener("change", e => handleFile(e.target.files[0]));
["dragenter", "dragover"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("out").value); $("copy").textContent = "Copied"; }
  catch { $("out").select(); document.execCommand("copy"); $("copy").textContent = "Copied"; }
  setTimeout(() => $("copy").textContent = "Copy", 1500);
});
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("out").value], { type: "text/plain;charset=utf-8" }));
  a.download = outName;
  a.click();
  URL.revokeObjectURL(a.href);
});

init();
</script>
</body>
</html>
